function render(){

 const h=decodeURIComponent(location.hash.replace('#',''));
 if(!h)return home();
 if(h==='login'){if(FBS.user){location.hash='';return}return authForm()}
 if(h==='admin'){clearInterval(TM);return FBS.admin?adminPage():home()}
 const qm=h.match(/^qz-([A-Za-z0-9-]+)$/);if(qm){return qstart(qm[1])}
 if(h==='me'){clearInterval(TM);return mePage()}
 if(h==='wrong'){clearInterval(TM);return wrongPage()}
 if(h==='mk'){clearInterval(TM);return mkPage()}
 if(h==='fx'){clearInterval(TM);return fxPage()}
 const sm=h.match(/^s-(.*)$/);if(sm){clearInterval(TM);return searchPage(sm[1])}
 clearInterval(TM);

 const um=h.match(/^hu-([a-z0-9]+)-([1-4])$/i);if(um){const ub=book(um[1]);return ub&&+um[2]<=UNITS[ub.key].u.length?unitPage(ub,+um[2]):home()}

 const m=h.match(/^([a-z0-9]+?)(?:-(.+))?$/i);
 const b=m&&book(m[1]);
 if(!b)return home();
 if(!m[2])return shelf(b);
 const sm2=m[2].match(/^u([1-4])$/i);if(sm2&&b.lu)return shelf(b,'',+sm2[1]);

 if(!v)return shelf(b);
 player(b,v);
}

 for(const k of ['hist','wrong','cq']){try{if(localStorage.getItem(UP+k)==null&&localStorage.getItem(k)!=null){localStorage.setItem(UP+k,localStorage.getItem(k));localStorage.removeItem(k)}}catch(e){}}
 for(const k of ['hist','wrong']){try{const s=await FB.kvGet(k);if(!s)continue;const r=JSON.parse(s),l=rawGet(UP+k);let m;
  if(k==='hist'){const seen={};m=[].concat(Array.isArray(r)?r:[],Array.isArray(l)?l:[]).filter(h=>{const u=h.id+'|'+h.t;if(seen[u])return false;return seen[u]=1}).sort((a,b)=>a.t-b.t).slice(-300)}
  else m=Object.assign({},r||{},l||{});
  localStorage.setItem(UP+k,JSON.stringify(m))}catch(e){}}}

 ad.innerHTML='<div class="stat"><div><b>'+AR(U.length-1<0?0:U.length-1)+'</b><small>طالب مسجّل</small></div><div><b>'+AR(pn)+'</b><small>بانتظار موافقتك</small></div><div><b>'+AR(on)+'</b><small>متصلين الآن</small></div></div>'
 +U.filter(u=>u.email!==FB.ADMIN).map(u=>{const st=u.status==='approved'?'<span class="pill g">مقبول</span>':u.status==='blocked'?'<span class="pill r">موقوف</span>':'<span class="pill y">بانتظار</span>';
  return '<div class="ur"><div><b>'+esc(u.name)+'</b> '+st+'<small dir="ltr" style="text-align:right">'+esc(u.phone||'')+' · '+esc(u.email)+'</small><small>'+ago(u.lastSeen)+'</small></div><div class="ua">'
  +(u.status!=='approved'?'<button class="btn gold" data-a="approved" data-u="'+u.uid+'">'+(u.status==='blocked'?'إعادة تفعيل':'موافقة')+'</button>':'<button class="btn" data-a="blocked" data-u="'+u.uid+'">إيقاف</button>')
  +(u.status==='pending'?'<button class="btn red" data-a="blocked" data-u="'+u.uid+'">رفض</button>':'')
  +'<button class="btn red" data-d="'+u.uid+'">حذف</button></div></div>'}).join('')||'<div class="empty">ما في طلاب لسا</div>';
 ad.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>FB.setStatus(b.dataset.u,b.dataset.a).then(()=>adStudents(ad)).catch(e=>toast(errT(e))));
 ad.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(b.dataset.c){FB.delUser(b.dataset.d).then(()=>adStudents(ad)).catch(e=>toast(errT(e)))}else{b.dataset.c=1;b.textContent='تأكيد الحذف؟'}})}
async function adResults(ad){
 const A=await getAtt(),names=[...new Set(A.map(a=>a.name))].sort();
 const sel=ad.dataset.s||'';
 const L=A.filter(a=>!sel||a.name===sel);
 const avg=L.length?Math.round(L.reduce((s,a)=>s+pct(a.score,a.total),0)/L.length):0;
 ad.innerHTML='<div class="fm"><select id="ss"><option value="">كل الطلاب</option>'+names.map(n=>'<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'
 +'<div class="stat"><div><b>'+AR(L.length)+'</b><small>محاولة</small></div><div><b>'+AR(avg)+'٪</b><small>المتوسط</small></div><div><b>'+AR(new Set(L.map(a=>a.uid)).size)+'</b><small>طالب</small></div></div>'
 +L.slice(0,150).map(a=>{const p=pct(a.score,a.total);return '<div class="ur"><div><b>'+esc(a.name)+'</b><small>'+esc(a.title||a.qid)+(a.exam?' · وضع امتحان':'')+'</small><small>'+fdt(a.at)+(a.dur?' · '+AR(Math.round(a.dur/60000))+' دقيقة':'')+'</small></div><span class="pill '+(p>=80?'g':p<50?'r':'y')+'">'+AR(a.score)+'/'+AR(a.total)+' · '+AR(p)+'٪</span></div>'}).join('')||'<div class="empty">ما في محاولات لسا</div>';
 document.getElementById('ss').onchange=e=>{ad.dataset.s=e.target.value;adResults(ad)}}
async function adHard(ad){
 const A=await getAtt(),T={},W={};
 A.forEach(a=>{(a.t||[]).forEach(k=>T[k]=(T[k]||0)+1);(a.w||[]).forEach(k=>W[k]=(W[k]||0)+1)});
 const R=Object.keys(W).filter(k=>T[k]>=2).map(k=>({k,w:W[k],t:T[k],p:Math.round(100*W[k]/T[k])})).sort((a,b)=>b.p-a.p||b.t-a.t).slice(0,30);
 ad.innerHTML='<p class="sub">الأسئلة اللي أكثر طلاب غلطوا فيها (من آخر '+AR(A.length)+' محاولة، سؤال انحلّ مرتين أو أكثر).</p>'
 +(R.map(r=>{const id=r.k.split(':')[0],n=r.k.split(':')[1];return '<a class="ur" href="#qz-'+esc(id)+'"><div><b>سؤال '+esc(n||'')+'</b><small>'+esc(id)+'</small></div><span class="pill r">'+AR(r.p)+'٪ غلط ('+AR(r.w)+' من '+AR(r.t)+')</span></a>'}).join('')||'<div class="empty">لسا ما في بيانات كافية</div>')}
async function adViews(ad){
 const V=await FB.views(400),C={};
 V.forEach(v=>{const k=v.k+'|'+v.id;(C[k]=C[k]||{n:0,t:v.t,k:v.k,id:v.id}).n++});
 const top=Object.values(C).sort((a,b)=>b.n-a.n).slice(0,20);
 ad.innerHTML='<div class="stat"><div><b>'+AR(V.length)+'</b><small>مشاهدة</small></div><div><b>'+AR(new Set(V.map(v=>v.uid)).size)+'</b><small>طالب شاهد</small></div></div><div class="sh">الأكثر مشاهدة</div>'
 +top.map(x=>'<a class="ur" href="#'+esc(x.k)+'-'+esc(x.id)+'"><div><b>'+esc(x.t||x.id)+'</b><small>'+esc(x.k)+' · '+esc(x.id)+'</small></div><span class="pill">'+AR(x.n)+' مشاهدة</span></a>').join('')
 +'<div class="sh">آخر المشاهدات</div>'+V.slice(0,30).map(v=>'<div class="ur"><div><b>'+esc(v.name)+'</b><small>'+esc(v.t||v.id)+'</small></div><small>'+fdt(v.at)+'</small></div>').join('')||'<div class="empty">ما في مشاهدات</div>'}
async function adUpload(ad){
 const have=await FB.blob('index').catch(()=>null);
 ad.innerHTML='<p>'+(have?'✅ الأسئلة مرفوعة على الخادم ('+AR(JSON.parse(have).length)+' اختبار).':'⚠️ الأسئلة لسا مش مرفوعة على الخادم.')+'</p><button class="btn gold" id="upb">☁️ رفع الأسئلة للخادم</button><p class="sub">بتاخد كم دقيقة، خلّي الصفحة مفتوحة لحد ما تخلص.</p><pre class="ulog" id="ul"></pre>';
 const lg=t=>{const u=document.getElementById('ul');if(u){u.textContent+=t+'\n';u.scrollTop=u.scrollHeight}};
 document.getElementById('upb').onclick=async function(){this.disabled=true;
  try{const FC={},inl=async s=>{const ms=[...new Set(s.match(/figs\/[A-Za-z0-9_.-]+\.(?:png|jpg|jpeg|svg)/g)||[])];for(const m of ms){if(!FC[m]){const b=await (await fetch('quiz/'+m)).blob();FC[m]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}s=s.split(m).join(FC[m])}return s};
   const ix=await (await fetch('quiz/index.json')).json();let i=0;
   for(const x of ix){i++;let s=await (await fetch('quiz/'+x.id+'.json')).text();s=await inl(s);const n=await FB.putBlob(x.id,s);lg(i+'/'+ix.length+'  '+x.id+'  ('+n+')')}
   await FB.putBlob('index',JSON.stringify(ix));
   await FB.putBlob('fx',await (await fetch('fx.json')).text());
   lg('✅ خلصت');toast('تم رفع الأسئلة')}catch(e){lg('❌ '+(e&&e.message||e));this.disabled=false}}}
/* ===== تثبيت المنصة كتطبيق ===== */
(function(){let dp=null;const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
 addEventListener('appinstalled',()=>{const x=document.getElementById('pwab');if(x)x.remove()});
 if(standalone())return;
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 const btn=document.createElement('button');btn.id='pwab';btn.innerHTML='📲 ثبّت التطبيق';
 btn.style.cssText='position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));z-index:55;background:var(--gold);color:#0a1630;border:0;border-radius:30px;padding:10px 16px;font:700 15px Cairo,system-ui;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer';
 btn.onclick=()=>{if(dp){dp.prompt();dp.userChoice.finally(()=>{dp=null});return}
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div><h3 style="margin-top:0;color:var(--gold)">📲 تثبيت المنصة على جوالك</h3>'+(ios?'<ol style="line-height:2;padding-right:20px"><li>اضغط زر <b>المشاركة</b> (المربع والسهم) أسفل سفاري</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b></li><li>اضغط <b>إضافة</b></li></ol>':'<ol style="line-height:2;padding-right:20px"><li>اضغط القائمة <b>⋮</b> أعلى المتصفح</li><li>اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b></li><li>اضغط <b>تثبيت</b></li></ol><p class="sub">لازم تفتح الموقع من متصفح كروم (أندرويد) أو سفاري (آيفون).</p>')+'<button class="btn gold" style="width:100%" id="pwc">تمام</button></div>';
  document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==='pwc')m.remove()}};
 document.body.appendChild(btn)})();
window.addEventListener('hashchange',render);bootApp();
</script></body></html>
