 let h='<div class="crumb"><a href="#">الرئيسية</a> ‹ <a href="#h-'+b.key+'">'+esc(G[0])+'</a> ‹ '+esc(u[0])+'</div><h1>'+esc(u[0])+'</h1><p class="sub">'+esc(G[0])+' — '+esc(G[1])+'</p><div class="books">';
 const I=ICON[b.key]||['','#fff'];
 if(U.vu===n)h+='<a class="ex" style="--c:'+I[1]+'" href="#'+b.key+'"><i>🎬</i><div><b>فيديوهات الشرح</b><span>'+AR(b.videos.length)+' فيديو</span></div></a>';
 h+='<a class="ex" style="--c:'+I[1]+'" href="#t-'+b.key+'-u'+n+'"><i>📝</i><div><b>الاختبارات</b><span>اختبارات تفاعلية وملفات PDF</span></div></a></div>';
 app.innerHTML=h;
}
const REPO='anassamerqawasmeh0000-max/Anas.qawasmeh.math';
const UN=['الأولى','الثانية','الثالثة','الرابعة'];
function tests(b,u){
 u=u||1;document.title='اختبارات الوحدة '+UN[u-1]+' — '+b.title;
 app.innerHTML='<div class="crumb"><a href="#">الرئيسية</a> ‹ <a href="#h-'+b.key+'">'+esc(GRADE[b.key][0])+'</a> ‹ <a href="#hu-'+b.key+'-'+u+'">الوحدة '+UN[u-1]+'</a> ‹ الاختبارات</div><h1>الوحدة '+UN[u-1]+' — اختبارات</h1><p class="sub">'+esc(b.title)+'. اضغط على الاختبار ليفتح، ومنه تقدر تحمّله أو تطبعه.</p><div id="ql"></div><div class="sh">📄 اختبارات PDF للطباعة</div><div id="tl" class="list"><div class="empty">جاري التحميل…</div></div>';
 quizList().then(L=>{L=L.filter(x=>(x.unit||1)===u&&(b.key==='f3'||x.unit===3&&b.key==='s3'));if(!L.length)return;const card=x=>{const s=LS.get('qz-'+x.id);return '<a class="qc" href="#qz-'+x.id+'"><b>'+esc(x.title)+'</b><span>'+AR(x.count)+' سؤال — '+esc(x.time)+(s&&s.done?' — آخر نتيجة: '+AR(s.score)+'/'+AR(x.total):s&&s.start?' — متابعة':'')+'</span></a>'};const LN=b.key==='s3'?{1:'الدرس الأول: مشتقات اقترانات خاصة',2:'الدرس الثاني: الضرب والقسمة والمشتقات العليا',3:'الدرس الثالث: قاعدة السلسلة',4:'الدرس الرابع: الاشتقاق الضمني',5:'الدرس الخامس: المعدلات المرتبطة'}:{1:'الدرس الأول: قياس الزاوية بالراديان',2:'الدرس الثاني: النسب المثلثية',3:'الدرس الثالث: اقترانا الجيب وجيب التمام'},LV=[['E','🟢 سهل'],['M','🟡 متوسط'],['H','🔴 صعب'],['X','⭐ اختبار شامل']];let h='<div class="sh">📝 اختبارات تفاعلية (تصحيح فوري مع شرح مفصل لكل سؤال)</div>';if(L.some(x=>x.lesson)){[1,2,3,4,5].forEach(n=>{const A=L.filter(x=>x.lesson===n);if(!A.length)return;h+='<details class="qg"><summary>'+LN[n]+' <small>('+AR(A.length)+' اختبارات)</small></summary>';LV.forEach(v=>{const B=A.filter(x=>x.level===v[0]);if(B.length)h+='<div class="lv">'+v[1]+'</div><div class="qlist">'+B.map(card).join('')+'</div>'});h+='</details>'});const R=L.filter(x=>!x.lesson);if(R.length)h+='<div class="qlist">'+R.map(card).join('')+'</div>'}else h+='<div class="qlist">'+L.map(card).join('')+'</div>';document.getElementById('ql').innerHTML=h});
 const box=document.getElementById('tl');const dir=b.key+'/u'+u;
 const show=fs=>{fs=fs.filter(f=>/\.(pdf|png|jpe?g|html?|docx?)$/i.test(f)).sort((x,y)=>x.localeCompare(y,'ar',{numeric:true}));
  box.innerHTML=fs.length?fs.map(f=>{const n=f.replace(/\.[^.]+$/,'').replace(/_/g,' ');const e=(f.split('.').pop()||'').toUpperCase();
   return '<a class="tf" target="_blank" rel="noopener" href="tests/'+dir+'/'+encodeURIComponent(f)+'"><span class="ic">📄</span><span class="t">'+esc(n)+'</span><small>'+esc(e)+'</small></a>'}).join(''):'<div class="empty">ما في اختبارات مرفوعة لهذه الوحدة حالياً. تابعنا قريباً.</div>'};
 let c=null;try{c=JSON.parse(sessionStorage.getItem('t-'+dir))}catch(e){}
 if(c&&Date.now()-c.t<120000)return show(c.f);
 fetch('https://api.github.com/repos/'+REPO+'/contents/tests/'+dir).then(r=>r.ok?r.json():[]).then(j=>{const f=Array.isArray(j)?j.filter(x=>x.type==='file').map(x=>x.name):[];try{sessionStorage.setItem('t-'+dir,JSON.stringify({t:Date.now(),f}))}catch(e){}show(f)}).catch(()=>{box.innerHTML='<div class="empty">تعذّر تحميل القائمة، حاول مرة ثانية.</div>'});
}
function shelf(b,q){
 document.title=b.title+' — منصة الرائد في الرياضيات';
 q=(q||'').trim().toLowerCase();
 let s='<div class="crumb"><a href="#">الرئيسية</a> ‹ '+esc(b.title)+'</div><h1>'+esc(b.title)+'</h1><p class="sub">'+esc(b.unit)+'</p><input class="search" id="q" type="search" placeholder="ابحث برقم السؤال أو بعنوانه…" value="'+esc(q)+'">';
 let any=false;
 b.lessons.forEach((L,l)=>{const vs=b.videos.filter(v=>v.l===l&&(!q||v.id.toLowerCase().includes(q)||v.t.toLowerCase().includes(q)));
  if(!vs.length)return;any=true;
  s+='<div class="lh"><span>'+esc(L)+'</span><small>'+AR(vs.length)+' فيديو</small></div><div class="list">'+vs.map(v=>item(b,v)).join('')+'</div>'});
 if(!any)s+='<div class="empty">ما في نتائج</div>';
 app.innerHTML=s;
 const inp=document.getElementById('q');
 inp.addEventListener('input',()=>{const pos=inp.selectionStart;const keep=inp.value;shelf(b,keep);const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)});
}
function player(b,v){
 document.title=v.t+' — منصة الرائد في الرياضيات';
 const same=b.videos.filter(x=>x.l===v.l);const i=same.findIndex(x=>x.id===v.id);
 const prev=same[i-1],next=same[i+1];
 const src='v/'+b.key+'/'+(v.a||v.id)+'.mp4';
 app.innerHTML='<div class="crumb"><a href="#">الرئيسية</a> ‹ <a href="#'+b.key+'">'+esc(b.title)+'</a></div><h1>'+esc(v.t)+'</h1><p class="sub">'+esc(b.lessons[v.l]||'')+' — سؤال '+esc(v.id)+'</p>'
 +'<div class="pl"><video id="vid" controls playsinline preload="metadata" src="'+src+'"></video></div>'
 +'<div class="ctl"><span style="color:var(--mut)">السرعة:</span>'+[0.75,1,1.25,1.5].map(r=>'<button class="btn'+(r===1?' on':'')+'" data-r="'+r+'">'+AR(r).replace('.','٫')+'×</button>').join('')+'</div>'
 +'<div class="note">الفيديو بدون صوت. اقرأ الشرح المكتوب في كل خطوة، وأوقف الفيديو في أي وقت بشريط التشغيل، وارجع لأي خطوة بالسحب.</div>'
 +'<div class="nav">'+(prev?'<a class="btn" href="#'+b.key+'-'+prev.id+'">› السؤال السابق</a>':'')+(next?'<a class="btn" href="#'+b.key+'-'+next.id+'">السؤال التالي ‹</a>':'')+'</div>'
 +'<div class="lh"><span>باقي أسئلة نفس الدرس</span></div><div class="list">'+same.map(x=>item(b,x,v.id)).join('')+'</div>';
 const vid=document.getElementById('vid');
 app.querySelectorAll('[data-r]').forEach(bt=>bt.onclick=()=>{vid.playbackRate=+bt.dataset.r;app.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===bt))});
 window.scrollTo(0,0);
}
/* ===== الاختبارات التفاعلية ===== */
const QS={};let QI=null;
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let Q=null,ST=null,TM=null;
function loadQuiz(id){return QS[id]?Promise.resolve(QS[id]):fetch('quiz/'+id+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>QS[id]=j)}
function quizList(){return QI?Promise.resolve(QI):fetch('quiz/index.json').then(r=>r.ok?r.json():[]).catch(()=>[]).then(j=>QI=j)}
function qstart(id){
 app.innerHTML='<div class="empty">جاري التحميل…</div>';
 loadQuiz(id).then(q=>{Q=q;ST=LS.get('qz-'+id)||null;qintro()}).catch(()=>{app.innerHTML='<div class="empty">تعذّر تحميل الاختبار، حاول مرة ثانية.</div>'});
}
function qintro(){
 clearInterval(TM);document.title=Q.title;
 const has=ST&&!ST.done&&ST.start;
 app.innerHTML='<div class="crumb"><a href="#">الرئيسية</a> ‹ <a href="#t-f3-u'+(Q.unit||1)+'">الوحدة '+UN[(Q.unit||1)-1]+'</a></div><div class="qz-card"><h1>'+esc(Q.title)+'</h1>'
 +'<p class="sub">اختبار تفاعلي — أجب عن الأسئلة، وبعد التسليم تشاهد علامتك وطريقة حل كل سؤال.</p>'
 +'<div class="chips"><span class="pill">عدد الأسئلة: '+N(Q.questions.length)+'</span><span class="pill">العلامة: '+N(Q.total)+'</span><span class="pill">الزمن: '+esc(Q.time)+'</span></div>'
 +'<div class="note">يمكنك التنقل بين الأسئلة وتغيير إجابتك قبل التسليم. تقدّمك يُحفظ على جهازك إذا خرجت من الصفحة.</div>'
 +'<div class="qnav">'+(has?'<button class="btn gold" id="go">متابعة الاختبار</button><button class="btn" id="re">ابدأ من جديد</button>':'<button class="btn gold" id="go">ابدأ الاختبار</button>')+'</div></div>'
 +(ST&&ST.done?'<div class="qnav"><button class="btn" id="last">عرض نتيجتي السابقة</button></div>':'');
 document.getElementById('go').onclick=()=>{if(!has)ST={start:Date.now(),a:{},i:0};qrun()};
 const re=document.getElementById('re');if(re)re.onclick=()=>{ST={start:Date.now(),a:{},i:0};LS.set('qz-'+Q.id,ST);qrun()};
 const la=document.getElementById('last');if(la)la.onclick=()=>qresult();
}
const N=x=>String(x);
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};
function qlimit(){const m=(Q.time||'').match(/(\d+)/);if(m)return +m[1]*60;if(/ساعتان/.test(Q.time))return 7200;if(/ساعة/.test(Q.time))return 3600;return 7200}
function qrun(){
 LS.set('qz-'+Q.id,ST);const n=Q.questions.length,q=Q.questions[ST.i],sel=ST.a[q.n];
 document.title=Q.title;
 const done=Object.keys(ST.a).length;
 app.innerHTML='<div class="qz-top"><span class="pill">سؤال '+N(ST.i+1)+' من '+N(n)+'</span><span class="pill" id="tm">⏱ --:--</span><span class="pill">أجبت '+N(done)+'</span></div>'
 +'<div class="qz-bar"><i style="width:'+(done/n*100)+'%"></i></div>'
 +'<div class="qz-card"><div class="qt"><span class="qn">'+N(q.n)+'</span>'+q.q+'</div>'+(q.fig?'<img class="qfig" src="'+q.fig+'" alt="">':'')
 +'<div class="ops">'+['a','b','c','d'].filter(k=>q.opts[k]!=null).map(k=>'<button class="op'+(q.opts[k].indexOf('mtable')>=0?' cs':'')+(sel===k?' sel':'')+'" data-k="'+k+'"><b>'+k+'</b><span>'+q.opts[k]+'</span></button>').join('')+'</div></div>'
 +'<div class="qnav"><button class="btn" id="pv"'+(ST.i?'':' disabled style="opacity:.4"')+'>› السابق</button><button class="btn" id="gr">☰ الأسئلة</button>'+(ST.i<n-1?'<button class="btn gold" id="nx">التالي ‹</button>':'<button class="btn gold" id="fin">إنهاء وتسليم</button>')+'</div>'
 +'<div class="qnav"><button class="btn red" id="fin2">إنهاء وتسليم الاختبار</button></div><div id="gw"></div>';
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(ST.a[q.n]===k)delete ST.a[q.n];else ST.a[q.n]=k;LS.set('qz-'+Q.id,ST);const y=scrollY;qrun();scrollTo(0,y)});
 const go=d=>{ST.i=Math.min(n-1,Math.max(0,ST.i+d));qrun();scrollTo(0,0)};
 document.getElementById('pv').onclick=()=>go(-1);const nx=document.getElementById('nx');if(nx)nx.onclick=()=>go(1);
 const fin=document.getElementById('fin');if(fin)fin.onclick=qconfirm;document.getElementById('fin2').onclick=qconfirm;
 document.getElementById('gr').onclick=()=>{const g=document.getElementById('gw');if(g.innerHTML){g.innerHTML='';return}
  g.innerHTML='<div class="grid">'+Q.questions.map((x,i)=>'<button data-i="'+i+'" class="'+(ST.a[x.n]?'done ':'')+(i===ST.i?'cur':'')+'">'+N(x.n)+'</button>').join('')+'</div>';
  g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ST.i=+b.dataset.i;qrun();scrollTo(0,0)});g.scrollIntoView({behavior:'smooth'})};
 clearInterval(TM);const lim=qlimit();const tick=()=>{const left=lim-Math.floor((Date.now()-ST.start)/1000);const e=document.getElementById('tm');if(e)e.textContent='⏱ '+fmt(left);if(left<=0){clearInterval(TM);qsubmit()}};tick();TM=setInterval(tick,1000);
}
function qconfirm(){
 const n=Q.questions.length,un=n-Object.keys(ST.a).length;
 const m=document.createElement('div');m.className='modal';
 m.innerHTML='<div><h2 style="margin:0 0 8px;font-family:Reem Kufi,Cairo;color:var(--gold)">تسليم الاختبار؟</h2><p style="margin:0 0 14px">'+(un?'لم تجب عن <b>'+N(un)+'</b> سؤال. ':'أجبت عن كل الأسئلة. ')+'بعد التسليم تظهر علامتك والحل.</p><div class="qnav"><button class="btn" id="no">رجوع للاختبار</button><button class="btn gold" id="yes">نعم، سلّم</button></div></div>';
 document.body.appendChild(m);m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#yes').onclick=()=>{m.remove();qsubmit()};
}
function qscore(){let s=0;Q.questions.forEach(q=>{if(ST.a[q.n]===q.ans)s+=q.marks});return s}
function qsubmit(){clearInterval(TM);ST.done=true;ST.score=qscore();ST.end=Date.now();LS.set('qz-'+Q.id,ST);qresult()}
function qresult(f){
 clearInterval(TM);f=f||'all';const n=Q.questions.length;const sc=ST.score!=null?ST.score:qscore(),tot=Q.total,p=Math.round(sc/tot*100);
 const ok=Q.questions.filter(q=>ST.a[q.n]===q.ans).length,no=Q.questions.filter(q=>!ST.a[q.n]).length,bad=n-ok-no;
 const msg=p>=90?'ممتاز! مستواك رائع 🌟':p>=75?'جيد جداً، كمّل 👏':p>=60?'جيد، راجع الأخطاء وستتحسن 💪':p>=50?'مقبول، تحتاج مراجعة أكثر':'تحتاج إلى مراجعة الدرس وإعادة المحاولة';
 const list=Q.questions.filter(q=>f==='all'||(f==='bad'&&ST.a[q.n]&&ST.a[q.n]!==q.ans)||(f==='no'&&!ST.a[q.n]));
 document.title='نتيجتك — '+Q.title;
 app.innerHTML='<div class="crumb"><a href="#">الرئيسية</a> ‹ <a href="#t-f3-u'+(Q.unit||1)+'">الوحدة '+UN[(Q.unit||1)-1]+'</a> ‹ النتيجة</div><div class="qz-card score"><div class="ring" style="--p:'+p+'"><div><span>'+N(sc)+'<small>من '+N(tot)+'</small></span></div></div><h2 style="margin:14px 0 2px;font-family:Reem Kufi,Cairo">'+N(p)+'٪</h2><div>'+msg+'</div>'
 +'<div class="chips" style="justify-content:center"><span class="pill">✅ صحيحة: '+N(ok)+'</span><span class="pill">❌ خاطئة: '+N(bad)+'</span><span class="pill">➖ بدون إجابة: '+N(no)+'</span></div></div>'
 +'<div class="grid gr2">'+Q.questions.map(q=>'<button data-n="'+q.n+'" class="'+(ST.a[q.n]===q.ans?'ok':ST.a[q.n]?'bad':'')+'">'+N(q.n)+'</button>').join('')+'</div>'
 +'<div class="sh">مراجعة الأسئلة وطريقة الحل</div><div class="chips"><button class="chip'+(f==='all'?' on':'')+'" data-f="all">الكل ('+N(n)+')</button><button class="chip'+(f==='bad'?' on':'')+'" data-f="bad">الأخطاء ('+N(bad)+')</button><button class="chip'+(f==='no'?' on':'')+'" data-f="no">بدون إجابة ('+N(no)+')</button></div>'
 +(list.length?list.map(q=>{const a=ST.a[q.n],c=a===q.ans?'ok':a?'bad':'no';
  return '<details class="rv '+c+'" id="r'+q.n+'"'+(f!=='all'?' open':'')+'><summary><span class="qn">'+N(q.n)+'</span><span style="flex:1">'+(c==='ok'?'✅ إجابتك صحيحة':c==='bad'?'❌ إجابتك خاطئة':'➖ لم تجب')+'</span><small style="color:var(--mut)">'+(a?'إجابتك: '+a+' — ':'')+'الصحيحة: '+q.ans+'</small></summary><div class="bd"><div class="qt">'+q.q+'</div>'+(q.fig?'<img class="qfig" src="'+q.fig+'" alt="">':'')
  +'<div class="ops">'+['a','b','c','d'].filter(k=>q.opts[k]!=null).map(k=>'<div class="op '+(q.opts[k].indexOf('mtable')>=0?'cs ':'')+(k===q.ans?'ok':k===a?'bad':'')+'"><b>'+k+'</b><span>'+q.opts[k]+'</span></div>').join('')+'</div>'
  +'<div class="sol"><h4>طريقة الحل</h4><ol>'+q.sol.map(s=>'<li>'+s+'</li>').join('')+'</ol></div></div></details>'}).join(''):'<div class="empty">لا توجد أسئلة في هذا القسم 👏</div>')
 +'<div class="qnav"><button class="btn gold" id="again">🔁 حل الاختبار من جديد</button><a class="btn" href="#t-f3-u'+(Q.unit||1)+'">رجوع للاختبارات</a></div>';
 app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>qresult(b.dataset.f));
 app.querySelectorAll('.grid.gr2 button').forEach(b=>b.onclick=()=>{const d=document.getElementById('r'+b.dataset.n);if(d){d.open=true;d.scrollIntoView({behavior:'smooth'})}else qresult('all')});
 document.getElementById('again').onclick=()=>{ST={start:Date.now(),a:{},i:0};LS.set('qz-'+Q.id,ST);qrun();scrollTo(0,0)};
 scrollTo(0,0);
}

function render(){
 const h=decodeURIComponent(location.hash.replace('#',''));
 if(!h)return home();
 const qm=h.match(/^qz-([A-Za-z0-9-]+)$/);if(qm){return qstart(qm[1])}
 clearInterval(TM);
 const hm=h.match(/^h-([a-z0-9]+)$/i);if(hm){const hb=book(hm[1]);return hb?hub(hb):home()}
 const um=h.match(/^hu-([a-z0-9]+)-([1-4])$/i);if(um){const ub=book(um[1]);return ub&&+um[2]<=UNITS[ub.key].u.length?unitPage(ub,+um[2]):home()}
 const tm=h.match(/^t-([a-z0-9]+?)(?:-u([1-4]))?$/i);if(tm){const tb=book(tm[1]);return tb?(tm[2]?tests(tb,+tm[2]):hub(tb,1)):home()}
 const m=h.match(/^([a-z0-9]+?)(?:-(.+))?$/i);
 const b=m&&book(m[1]);
 if(!b)return home();
 if(!m[2])return shelf(b);
 const v=b.videos.find(x=>x.id===m[2]);
 if(!v)return shelf(b);
 player(b,v);
}
window.addEventListener('hashchange',render);render();
</script></body></html>
